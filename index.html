<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Spend</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Restore the saved theme before the first paint.
    try {

    } catch {}
  </script>
</head>
